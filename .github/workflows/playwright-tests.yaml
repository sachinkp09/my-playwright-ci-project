name: CI Pipeline

on:
  push:
    branches:
      - "*"        # run CI on all branches
      - "!main"    # ignore direct pushes to main
  pull_request:
    branches:
      - main       # run CI when PR targets main

permissions:
  contents: read
  packages: write
  models: read

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull cached image
        run: docker pull ghcr.io/${{ github.repository_owner }}/playwright-tests:latest || echo "No cache found"

      - name: Build Docker image using GHCR cache
        run: |
          docker build \
            --cache-from ghcr.io/${{ github.repository_owner }}/playwright-tests:latest \
            -t playwright-tests:ci .

      - name: Run Playwright tests
        run: |
          mkdir -p logs
          chmod 777 logs
          docker run --rm \
            -v "${{ github.workspace }}/logs:/app/logs" \
            playwright-tests:ci

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore

  push-image:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image for GHCR
        run: docker build -t ghcr.io/${{ github.repository_owner }}/playwright-tests:latest .

      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/playwright-tests:latest

  ai-analysis:
    needs: tests
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Download test logs
        uses: actions/download-artifact@v4
        with:
          name: test-logs
          path: logs/

      - name: AI Failure Analysis
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          log_content="$(find logs -type f -print -exec cat {} \; 2>/dev/null || true)"
          if [ -z "$log_content" ]; then
            log_content="No test log file was uploaded. Use the workflow context and test output to identify likely causes."
          fi

          prompt="You are analyzing a failed Playwright CI run for ${{ github.repository }}.

          Summarize the failure, identify the most likely root cause, suggest concrete fixes, and point out any CI configuration problems. Be concise and distinguish evidence from hypotheses.

          Test logs:
          $log_content"

          request="$(jq -n \
            --arg prompt "$prompt" \
            '{model:"openai/gpt-4o-mini",messages:[{role:"user",content:$prompt}],temperature:0.2}')"

          response="$(curl --silent --show-error --fail-with-body \
            -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$request")"

          analysis="$(printf '%s' "$response" | jq -r '.choices[0].message.content // empty')"
          if [ -z "$analysis" ]; then
            echo "GitHub Models returned no analysis."
            exit 1
          fi

          printf '%s\n' "$analysis" | tee ai-analysis.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AI analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-failure-analysis
          path: ai-analysis.md
          if-no-files-found: ignore
