name: CI Pipeline

on:
  push:
    branches:
      - "*"        # run CI on all branches
      - "!main"    # ignore direct pushes to main
  pull_request:
    branches:
      - main       # run CI when PR targets main

permissions:
  contents: read
  packages: write
  models: read     # Required to authenticate with the GitHub Models platform

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull cached image
        run: docker pull ghcr.io/${{ github.repository_owner }}/playwright-tests:latest || echo "No cache found"

      - name: Build Docker image using GHCR cache
        run: |
          docker build \
            --cache-from ghcr.io/${{ github.repository_owner }}/playwright-tests:latest \
            -t playwright-tests:ci .

      - name: Run Playwright tests
        run: |
          mkdir -p logs
          set +e
          docker run --name playwright-tests-run playwright-tests:ci
          test_status=$?
          docker cp playwright-tests-run:/app/logs/. logs/ || true
          docker rm playwright-tests-run
          exit $test_status

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore

  push-image:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image for GHCR
        run: docker build -t ghcr.io/${{ github.repository_owner }}/playwright-tests:latest .

      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/playwright-tests:latest

  ai-analysis:
    needs: tests
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Download test logs
        uses: actions/download-artifact@v4
        with:
          name: test-logs
          path: logs/

      - name: Run AI Diagnostic via Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import glob
          import json
          import os
          import urllib.error
          import urllib.request

          log_content = ""
          for path in glob.glob("logs/**/*", recursive=True):
            if os.path.isfile(path):
              try:
                with open(path, "r", encoding="utf-8", errors="ignore") as file:
                  log_content += f"\n--- File: {path} ---\n{file.read()}"
              except OSError:
                pass

          if not log_content.strip():
            log_content = "No clear text log files were found in the test-log artifact."

          prompt = f"""You are analyzing a failed Playwright CI run for {os.environ['REPO_NAME']}.
          Summarize the failure, identify the most likely root cause, suggest concrete fixes, and point out CI configuration problems. Be concise and distinguish evidence from hypotheses.

          Test logs:
          {log_content}"""

          body = json.dumps({
            "model": "openai/gpt-4o-mini",
            "messages": [{"role": "user", "content": prompt}],
            "temperature": 0.2,
          }).encode("utf-8")

          request = urllib.request.Request(
            "https://models.github.ai/inference/chat/completions",
            data=body,
            headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
            },
            method="POST",
          )

          try:
            with urllib.request.urlopen(request) as response:
              response_text = response.read().decode("utf-8")
          except urllib.error.HTTPError as error:
            error_text = error.read().decode("utf-8", errors="replace")
            raise RuntimeError(f"GitHub Models returned HTTP {error.code}: {error_text}") from error

          try:
            response_data = json.loads(response_text)
          except json.JSONDecodeError as error:
            raise RuntimeError(f"GitHub Models returned non-JSON data: {response_text[:1000]}") from error

          try:
            analysis = response_data["choices"][0]["message"]["content"]
          except (KeyError, IndexError, TypeError) as error:
            raise RuntimeError(f"Unexpected GitHub Models response: {response_text[:1000]}") from error

          with open("ai-analysis.md", "w", encoding="utf-8") as output_file:
            output_file.write(analysis)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
            summary_file.write("\n### Automated AI Diagnostic Report\n" + analysis + "\n")

          print("Analysis generated and written to the job summary.")
          PY

      - name: Upload AI analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-failure-analysis
          path: ai-analysis.md
          if-no-files-found: ignore