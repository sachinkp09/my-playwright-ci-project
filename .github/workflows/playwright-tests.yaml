name: CI Pipeline

on:
  push:
    branches:
      - "*"        # run CI on all branches
      - "!main"    # ignore direct pushes to main
  pull_request:
    branches:
      - main       #  run CI when PR targets main

permissions:
  contents: read
  packages: write

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull cached image
        run: docker pull ghcr.io/${{ github.repository_owner }}/playwright-tests:latest || echo "No cache found"

      - name: Build Docker image using GHCR cache
        run: |
          docker build \
            --cache-from ghcr.io/${{ github.repository_owner }}/playwright-tests:latest \
            -t playwright-tests:ci .

      - name: Run Playwright tests
        run: |
          mkdir -p logs
          set +e
          docker run --name playwright-tests-run playwright-tests:ci
          test_status=$?
          docker cp playwright-tests-run:/app/logs/. logs/ || true
          docker rm playwright-tests-run
          exit $test_status

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore

  push-image:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image for GHCR
        run: docker build -t ghcr.io/${{ github.repository_owner }}/playwright-tests:latest .

      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/playwright-tests:latest

  ai-analysis:
    needs: tests
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Download test logs
        uses: actions/download-artifact@v4
        with:
          name: test-logs
          path: logs/

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install GitHub Copilot CLI
        run: npm install --global @github/copilot

      - name: Prepare AI prompt
        run: |
          {
          echo "You are analyzing a failed Playwright CI run for ${{ github.repository }}."
          echo "Summarize the failure, identify the most likely root cause, suggest concrete fixes, and point out CI configuration problems. Be concise and distinguish evidence from hypotheses."
          echo
          echo "Test logs:"
          find logs -type f -print -exec sh -c 'echo "--- $1 ---"; cat "$1"' _ {} \; 2>/dev/null || true
          } > ai-prompt.txt

      - name: Run AI Diagnostic via Copilot
        id: inference
        uses: actions/ai-inference@v3
        with:
          prompt-file: ai-prompt.txt
          model: gpt-4.1
          token: ${{ secrets.COPILOT_PAT }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Save AI analysis
        run: |
          cp "${{ steps.inference.outputs.response-file }}" ai-analysis.md
          {
          echo "### Automated AI Diagnostic Report"
          cat ai-analysis.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AI analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-failure-analysis
          path: ai-analysis.md
          if-no-files-found: ignore