name: CI Pipeline

on:
  push:
    branches:
      - "*"
      - "!main"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Create quarantine file if missing (prevents artifact download errors)
      - name: Prepare quarantine file
        run: |
          mkdir -p quarantine
          if [ ! -f quarantine/quarantined_tests.txt ]; then
            echo "" > quarantine/quarantined_tests.txt
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull cached image
        run: docker pull ghcr.io/${{ github.repository_owner }}/playwright-tests:latest || echo "No cache found"

      - name: Build Docker image using GHCR cache
        run: |
          docker build \
            --cache-from ghcr.io/${{ github.repository_owner }}/playwright-tests:latest \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t playwright-tests:ci .

      - name: Run Playwright tests
        run: |
          mkdir -p logs

          set +e
          docker run --name playwright-tests-run \
            -e BUILD_SHA=${{ github.sha }} \
            -e BUILD_ACTOR=${{ github.actor }} \
            playwright-tests:ci
          test_status=$?

          docker cp playwright-tests-run:/app/logs/. logs/ || true
          docker cp playwright-tests-run:/app/metadata.txt logs/ || true

          docker rm playwright-tests-run

          exit $test_status

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore

      - name: Detect flaky tests
        if: always()
        run: |
          mkdir -p flaky
          if grep -R "RERUN" logs/; then
            echo "Flaky tests detected"
            grep -R "RERUN" logs/ > flaky/flaky_tests.txt
          else
            echo "None" > flaky/flaky_tests.txt
          fi

      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests
          path: flaky/
          if-no-files-found: ignore

      - name: Update quarantine list
        if: always()
        run: |
          mkdir -p quarantine
          touch quarantine/quarantined_tests.txt

          if grep -R "RERUN" logs/; then
            echo "Updating quarantine list"
            grep -R "RERUN" logs/ | awk '{print $NF}' >> quarantine/quarantined_tests.txt
          fi

          sort -u quarantine/quarantined_tests.txt -o quarantine/quarantined_tests.txt

      - name: Upload quarantine list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine
          path: quarantine/
          if-no-files-found: ignore

  push-image:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image with version tags
        run: |
          # Build once
          docker build -t ghcr.io/${{ github.repository_owner }}/playwright-tests:latest .

          # Tag for main branch
          docker tag ghcr.io/${{ github.repository_owner }}/playwright-tests:latest \
                     ghcr.io/${{ github.repository_owner }}/playwright-tests:main

          # Tag with immutable commit SHA
          docker tag ghcr.io/${{ github.repository_owner }}/playwright-tests:latest \
                     ghcr.io/${{ github.repository_owner }}/playwright-tests:sha-${{ github.sha }}

      - name: Push all tags
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/playwright-tests:latest
          docker push ghcr.io/${{ github.repository_owner }}/playwright-tests:main
          docker push ghcr.io/${{ github.repository_owner }}/playwright-tests:sha-${{ github.sha }}