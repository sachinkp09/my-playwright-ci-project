name: CI Pipeline

on:
  push:
    branches:
      - "*"        # run CI on all branches
      - "!main"    # but ignore direct pushes to main
  pull_request:
    branches:
      - main       # run CI when PR targets main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-tests:ci .

      - name: Run Playwright tests inside Docker
        run: docker run --rm playwright-tests:ci

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore

  ai-analysis:
    needs: tests
    runs-on: ubuntu-latest
    if: failure()   # AI runs only when tests fail

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test logs
        uses: actions/download-artifact@v4
        with:
          name: test-logs
          path: logs/

      - name: AI Failure Analysis
        uses: azure/ai-assistant-action@v1
        with:
          input: |
            Analyze Playwright test failures.
            Summarize logs.
            Identify root causes.
            Suggest fixes.
            Validate CI pipeline steps.