name: Playwright Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # Nightly regression at 01:00 Munich time

jobs:
  tests:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright
          pip install allure-pytest

      - name: Install Playwright system dependencies
        run: |
          sudo npx playwright install-deps

      - name: Install ALL Playwright browsers
        run: |
          playwright install

      - name: Run tests
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            pytest -m smoke --alluredir=allure-results -n auto --reruns 2
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pytest -m smoke --alluredir=allure-results -n auto --reruns 2
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pytest -m "smoke or regression" --alluredir=allure-results -n auto --reruns 2
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            pytest -m regression --alluredir=allure-results -n auto --reruns 2
          fi

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/

  build-allure:
    name: Build Allure Report
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results

      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure-2.29.0.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

  deploy-allure:
    name: Deploy Allure Dashboard to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-allure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
