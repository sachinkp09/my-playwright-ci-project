name: Playwright Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # Nightly regression at 01:00 Munich time

jobs:
  tests:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-playwright
          pip install allure-pytest
          playwright install ${{ matrix.browser }}

      - name: Run tests
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            pytest -m smoke --alluredir=allure-results -n auto --reruns 2
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pytest -m smoke --alluredir=allure-results -n auto --reruns 2
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pytest -m "smoke or regression" --alluredir=allure-results -n auto --reruns 2
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            pytest -m regression --alluredir=allure-results -n auto